<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="CSS/style.css">
  <title>Olha a senha</title>
</head>
<body>

  <div class="login-box">
    <h2>Digite a senha</h2>

    <input type="password" id="senha" placeholder="A melhor senha né">
    <button onclick="verificarSenha()">Entrar</button>

    <p class="erro" id="mensagem"></p>
  </div>

  <script>
  function verificarSenha() {
 
    const password = "R3VpMTdAdmluaTAy"; 
    
    const senhaDigitada = document.getElementById("senha").value;
    
    if (btoa(senhaDigitada) === password) {
      window.location.href = "si.html";
    } else {
      document.getElementById("mensagem").innerText = "Senha incorreta!";
      document.getElementById("mensagem").style.color = "red";
    }
  }

  document.getElementById("senha").addEventListener("keypress", function(e) {
    if (e.key === "Enter") verificarSenha();
  });
</script>


</body>
</html>
